name: Deploy youjunhui to Cloudflare

# push main 自动部署到 Cloudflare Workers
# 需要在仓库 Settings → Secrets → Actions 配置：
#   CLOUDFLARE_API_TOKEN  — Workers 部署权限 token
#   CLOUDFLARE_ACCOUNT_ID — 90b09e9278970f131690e99f858ac7c6

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ secrets 未配置，跳过部署（配置后 push 即自动上线）"
            exit 0
          fi
          npx wrangler deploy

      - name: Verify live URL
        if: success()
        env:
          ADMIN_KEY_SEED: ${{ secrets.ADMIN_KEY_SEED }}
        run: |
          # 全链路冒烟：主页 + 埋点入库 + 后台鉴权
          HOST=iam.youjunhui.workers.dev
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://$HOST/ || true)
            echo "$HOST attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 8
          done
          [ "$CODE" = "200" ] || { echo "❌ 主页探活失败"; exit 1; }

          T=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST https://$HOST/api/track \
            -H 'content-type: application/json' -H 'user-agent: smoke-check' \
            -d "{\"t\":\"visit\",\"sid\":\"$GITHUB_RUN_ID\"}")
          echo "track: HTTP $T (期望 204)"
          A0=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$HOST/admin")
          echo "admin 无key: HTTP $A0 (期望 401)"
          A1=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$HOST/admin?key=$ADMIN_KEY_SEED")
          echo "admin 带key: HTTP $A1 (期望 200)"
          [ "$T" = "204" ] && [ "$A0" = "401" ] && [ "$A1" = "200" ] \
            && echo "✅ 全链路冒烟通过" || { echo "❌ 冒烟不过"; exit 1; }
