name: Deploy youjunhui to Cloudflare

# push main 自动部署到 Cloudflare Workers
# 需要在仓库 Settings → Secrets → Actions 配置：
#   CLOUDFLARE_API_TOKEN  — Workers 部署权限 token
#   CLOUDFLARE_ACCOUNT_ID — 90b09e9278970f131690e99f858ac7c6

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ secrets 未配置，跳过部署（配置后 push 即自动上线）"
            exit 0
          fi
          npx wrangler deploy

      - name: Verify live URL
        if: success()
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://youjunhui.youjh120608.workers.dev/ || true)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && echo "✅ 线上探活 200" && exit 0
            sleep 10
          done
          echo "❌ 线上探活失败（部署可能已成功但 DNS/网络未就绪）"
          exit 1
