name: Verify data (manual)

# 手动触发：直查 D1 数据 + 后台页面渲染内容，双验证统计链路
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query D1 + admin page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY_SEED: ${{ secrets.ADMIN_KEY_SEED }}
        run: |
          echo "== 清理冒烟噪音（sid 无连字符 = 部署冒烟；真实访客是 UUID/hex）=="
          npx wrangler d1 execute you-site-analytics --remote --file=db/cleanup-smoke.sql --yes
          echo "== D1 原始数据（清理后应为空）=="
          npx wrangler d1 execute you-site-analytics --remote --json \
            --command "SELECT type, COUNT(*) n FROM events GROUP BY type" | jq '.[0].results'
          echo "== D1 最近 3 条 =="
          npx wrangler d1 execute you-site-analytics --remote --json \
            --command "SELECT ts,type,el,sid,country,w FROM events ORDER BY ts DESC LIMIT 3" | jq '.[0].results'
          echo "== 后台页面实渲染（独立访客卡片）=="
          curl -s --max-time 20 "https://iam.youjunhui.workers.dev/admin?key=$ADMIN_KEY_SEED" -o /tmp/admin.html
          grep -o '<div class="card"><b>[^<]*</b><span>[^<]*</span>' /tmp/admin.html | sed 's/<[^>]*>/ /g'
          echo "== 最近访问表行数 =="
          grep -c 'dwell_ms\|<tr><td class="num">' /tmp/admin.html || true
